# The whole config of the demo's frontend: nginx serves index.html and relays /api/ to the
# `api` service.
#
# nginx writes nothing to the image: its pid file and its temporary files go to /dev/shm, the
# tmpfs Docker gives every container. The container runs with a read-only root filesystem.

daemon off;
worker_processes 1;
pid /dev/shm/nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    log_format brief '$request_method $request_uri $status ${body_bytes_sent}B ${request_time}s';
    access_log /dev/stdout brief;

    client_body_temp_path /dev/shm/client_body;
    proxy_temp_path /dev/shm/proxy;
    fastcgi_temp_path /dev/shm/fastcgi;
    uwsgi_temp_path /dev/shm/uwsgi;
    scgi_temp_path /dev/shm/scgi;

    # Bodies stay in memory: the API takes 16 KiB at most.
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    # Docker's DNS, asked again every 10 s rather than once at startup: nginx starts even if
    # `api` does not exist yet, and follows it when it is redeployed.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # The demo is public, behind Traefik: nginx sees one client address, so the limit on posts
    # is global. Reads are not limited.
    map $request_method $post_key {
        POST "post";
        default "";
    }
    limit_req_zone $post_key zone=posts:64k rate=2r/s;
    limit_req_status 429;

    server {
        listen 8080;
        root /srv/www;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        }

        location /api/ {
            # A variable makes nginx resolve `api` at request time. Without a URI after the
            # host, the request's URI is passed as is.
            limit_req zone=posts burst=20 nodelay;
            set $api http://api:8080;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            # Responses stay in memory too: 50 messages fit in the buffers, and a larger one
            # is passed on as it comes rather than spooled to disk.
            proxy_buffers 16 16k;
            proxy_max_temp_file_size 0;
            # `api` does not resolve, or does not answer.
            error_page 502 504 = @api_unreachable;
        }

        location @api_unreachable {
            default_type application/json;
            return 502 '{"error":"the api is unreachable"}\n';
        }
    }
}
